# Semantic versioning driven by Conventional Commits.
# Every push to main updates a "release PR" (version bump + CHANGELOG).
# Merging that PR tags vX.Y.Z and publishes a GitHub release.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
