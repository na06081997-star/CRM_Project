name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm
          POSTGRES_DB: crm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U crm" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: backend/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet -tags integration ./...
      - name: Unit tests
        run: go test -race -count=1 ./...
      - name: Integration tests (PostgreSQL)
        env:
          TEST_DATABASE_URL: postgres://crm:crm@localhost:5432/crm_test?sslmode=disable
        run: go test -tags integration -count=1 -p 1 ./internal/service/...

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Type check
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build all images
        run: |
          cp .env.example .env
          docker compose build
      - name: Smoke test the stack
        run: |
          docker compose up -d
          for i in $(seq 1 40); do
            curl -fs http://localhost/api/health && break
            sleep 3
          done
          curl -fs http://localhost/api/health
          curl -fs http://localhost/api/public/signage | head -c 300
          curl -fs http://localhost/ | grep -q 'id="root"'
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=200
