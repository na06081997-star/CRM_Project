# קהילה+ CRM — full stack
#
#   Browser ──► traefik ──► frontend (nginx: SPA + /api,/ws proxy) ──► backend (Go)
#                                                                         ├─► postgres
#                                                                         ├─► redis
#                                                                         └─► garage (S3)
#
# Only Traefik publishes a port. Everything else talks over the private
# `internal` network. On Dokploy, leave COMPOSE_PROFILES empty so the bundled
# Traefik is skipped and attach the domain to the `frontend` service.

name: crm

x-restart: &restart
  restart: unless-stopped

services:
  traefik:
    <<: *restart
    image: traefik:v3.6
    profiles: ["standalone"]
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=crm_web
      - --entrypoints.web.address=:80
      - --ping=true
      - --log.level=INFO
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [web]
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    <<: *restart
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    networks: [web, internal]
    labels:
      - traefik.enable=true
      - traefik.http.routers.crm.rule=Host(`${DOMAIN:-localhost}`)
      - traefik.http.routers.crm.entrypoints=web
      - traefik.http.services.crm.loadbalancer.server.port=80

  backend:
    <<: *restart
    build:
      context: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      S3_ENDPOINT: garage:3900
      HTTP_ADDR: ":8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      garage-init:
        condition: service_completed_successfully
    networks: [internal]
    healthcheck:
      test: ["CMD", "/app/server", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  postgres:
    <<: *restart
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ:-Asia/Jerusalem}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    <<: *restart
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  garage:
    <<: *restart
    image: dxflrs/garage:v1.0.1
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
    volumes:
      - ./docker/garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    networks: [internal]
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: assigns the single-node layout, imports the S3 key and creates
  # the bucket through Garage's admin API. Idempotent, safe to re-run.
  garage-init:
    image: alpine:3.20
    command: ["sh", "/init.sh"]
    environment:
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
    volumes:
      - ./docker/garage/init.sh:/init.sh:ro
    depends_on:
      garage:
        condition: service_healthy
    networks: [internal]

networks:
  web:
    name: crm_web
  internal: {}

volumes:
  postgres-data:
  redis-data:
  garage-meta:
  garage-data:
