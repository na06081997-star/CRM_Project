# קהילה+ CRM — full stack
#
#   Browser ──► traefik ──► frontend (nginx: SPA + /api,/ws proxy) ──► backend (Go)
#                                                                         ├─► postgres
#                                                                         ├─► redis
#                                                                         └─► garage (S3)
#
# This file is the core stack and publishes no port. Routing is added by:
#   - Dokploy (production): attach the domain to the `frontend` service in the
#     UI; Dokploy adds its Traefik labels and network.
#   - docker-compose.standalone.yml (local / plain VPS): bundled Traefik.
#     Enabled through COMPOSE_FILE in .env.
# Optional OpenSign stack (contract signatures, docs/opensign.md): services in
# the "opensign" profile, enabled with COMPOSE_PROFILES=opensign and
# OPENSIGN_PUBLIC_URL; its domain is attached to the `opensign` service.
# No fixed container or network names, so several client stacks can share a host.

name: crm

x-restart: &restart
  restart: unless-stopped

services:
  frontend:
    <<: *restart
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    networks: [internal]

  backend:
    <<: *restart
    build:
      context: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      S3_ENDPOINT: garage:3900
      HTTP_ADDR: ":8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      garage-init:
        condition: service_completed_successfully
    volumes:
      # OpenSign's master key (empty when the opensign profile is off).
      - opensign-secrets:/run/opensign:ro
    networks: [internal]
    healthcheck:
      test: ["CMD", "/app/server", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  postgres:
    <<: *restart
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ:-Asia/Jerusalem}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    <<: *restart
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  garage:
    <<: *restart
    image: dxflrs/garage:v1.0.1
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
    volumes:
      - ./docker/garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    networks: [internal]
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: assigns the single-node layout, imports the S3 key and creates
  # the bucket through Garage's admin API. Idempotent, safe to re-run.
  garage-init:
    image: alpine:3.20
    command: ["sh", "/init.sh"]
    environment:
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
    volumes:
      - ./docker/garage/init.sh:/init.sh:ro
    depends_on:
      garage:
        condition: service_healthy
    networks: [internal]

  # ── OpenSign (profile "opensign") ─────────────────────────────────────────
  # Self-hosted OpenSign, one per environment so each client's documents stay
  # in its own stack. Secrets are generated on the server by opensign-init.

  opensign-init:
    image: alpine:3.20
    profiles: [opensign]
    command: ["sh", "/init.sh"]
    environment:
      OPENSIGN_CERT_NAME: ${ORG_NAME:-CRM} document signing
      OPENSIGN_CERT_ORG: ${ORG_NAME:-CRM}
    volumes:
      - ./docker/opensign/init.sh:/init.sh:ro
      - opensign-secrets:/secrets
    networks: [internal]

  opensign-mongo:
    <<: *restart
    image: mongo:7
    profiles: [opensign]
    volumes:
      - opensign-mongo:/data/db
    networks: [internal]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  opensign-server:
    <<: *restart
    image: opensign/opensignserver:main
    profiles: [opensign]
    entrypoint: ["sh", "/start-server.sh"]
    environment:
      NODE_ENV: production
      APP_ID: opensign
      appName: OpenSign
      MONGODB_URI: mongodb://opensign-mongo:27017/OpenSignDB
      PARSE_MOUNT: /app
      SERVER_URL: ${OPENSIGN_PUBLIC_URL:-http://localhost}/api/app
      PUBLIC_URL: ${OPENSIGN_PUBLIC_URL:-http://localhost}
      USE_LOCAL: "true"
      SMTP_ENABLE: "false"
      TZ: ${TZ:-Asia/Jerusalem}
    volumes:
      - ./docker/opensign/start-server.sh:/start-server.sh:ro
      - opensign-secrets:/secrets:ro
      - opensign-files:/usr/src/app/files
    depends_on:
      opensign-init:
        condition: service_completed_successfully
      opensign-mongo:
        condition: service_healthy
    networks: [internal]

  opensign-client:
    <<: *restart
    image: opensign/opensign:main
    profiles: [opensign]
    environment:
      PUBLIC_URL: ${OPENSIGN_PUBLIC_URL:-http://localhost}
    networks: [internal]

  # Entry point published by Dokploy (domain → service "opensign", port 80).
  opensign:
    <<: *restart
    image: caddy:2-alpine
    profiles: [opensign]
    volumes:
      - ./docker/opensign/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - opensign-server
      - opensign-client
    networks: [internal]

networks:
  internal: {}

volumes:
  postgres-data:
  redis-data:
  garage-meta:
  garage-data:
  opensign-secrets:
  opensign-mongo:
  opensign-files:
